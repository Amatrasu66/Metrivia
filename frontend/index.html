<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Metrivia — responsive CSV data visualization application shell."
    />
    <meta name="theme-color" content="#f5f0e6" />
    <title>Metrivia — CSV Data Visualization</title>
    <script>
      // Apply the persisted (or OS-preferred) theme before first paint to
      // avoid a light/dark flash. Mirrors src/lib/theme.js logic.
      try {
        var metriviaTheme = localStorage.getItem("metrivia-theme");
        if (metriviaTheme !== "light" && metriviaTheme !== "dark") {
          metriviaTheme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        if (metriviaTheme === "dark") {
          document.documentElement.classList.add("dark");
        }
        document.documentElement.style.colorScheme = metriviaTheme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
