<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Metrivia — responsive CSV data visualization application shell."
    />
    <meta name="theme-color" content="#fafafa" />
    <title>Metrivia — CSV Data Visualization</title>
    <script>
      // Phase H theme bootstrap: Amber must be the FIRST painted theme.
      // Runs synchronously before first paint / before React mounts.
      // Mirrors src/lib/themes/theme-utils.js + app-settings-storage.js:
      //   stored theme id -> validated id (Amber fallback)
      //   stored appearance -> light/dark/system (legacy key migrated)
      //   system -> matchMedia resolution
      // Then sets data-theme + .dark + colorScheme AND re-applies the last
      // persisted CSS variables (if any) so returning users with a non-
      // Amber theme do not flash Amber first. React's SettingsProvider
      // reads the same keys and re-applies the same values (no conflict).
      try {
        var KNOWN_THEMES = [
          "mocha-mousse",
          "nebula",
          "monochrome",
          "lavender",
          "candy",
          "amber",
          "warm-paper",
          "iris",
          "twilight",
          "arcade",
          "graphite",
          "sage",
          "terminal",
          "emerald",
          "brutalist",
          "doodle",
          "orchid",
          "moss",
          "parchment",
          "mint",
        ];
        var appearance = null;
        try {
          appearance = localStorage.getItem("metrivia.appearance");
        } catch (e) {}
        if (
          appearance !== "light" &&
          appearance !== "dark" &&
          appearance !== "system"
        ) {
          var legacy = null;
          try {
            legacy = localStorage.getItem("metrivia-theme");
          } catch (e) {}
          appearance =
            legacy === "light" || legacy === "dark" ? legacy : "system";
        }
        var mode =
          appearance === "system"
            ? window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : appearance;
        var storedId = null;
        try {
          storedId = localStorage.getItem("metrivia.theme-id");
        } catch (e) {}
        var themeId =
          KNOWN_THEMES.indexOf(storedId) !== -1 ? storedId : "amber";
        var el = document.documentElement;
        el.setAttribute("data-theme", themeId);
        if (mode === "dark") {
          el.classList.add("dark");
        } else {
          el.classList.remove("dark");
        }
        el.style.colorScheme = mode;
        // Re-apply last persisted variables for exact first paint.
        // Written by applyThemeTokens() on every theme/mode change.
        try {
          var cached = localStorage.getItem("metrivia.theme-vars");
          if (cached) {
            var parsed = JSON.parse(cached);
            if (
              parsed &&
              parsed.themeId === themeId &&
              parsed.mode === mode &&
              parsed.vars &&
              typeof parsed.vars === "object"
            ) {
              for (var key in parsed.vars) {
                if (
                  Object.prototype.hasOwnProperty.call(parsed.vars, key) &&
                  key.indexOf("--") === 0
                ) {
                  el.style.setProperty(key, parsed.vars[key]);
                }
              }
            }
          }
        } catch (e) {}
        // Keep the theme-color meta in sync with the resolved mode so the
        // browser chrome paints Amber immediately (no gray tint).
        try {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              "content",
              mode === "dark" ? "#2b2b2b" : "#fafafa",
            );
          }
        } catch (e) {}
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
