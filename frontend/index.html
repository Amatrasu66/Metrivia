<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Metrivia — responsive CSV data visualization application shell."
    />
    <meta name="theme-color" content="#f5f0e6" />
    <title>Metrivia — CSV Data Visualization</title>
    <script>
      // Apply the persisted theme + appearance before first paint to avoid a
      // light/dark flash. Mirrors src/hooks/useAppSettings.jsx +
      // src/lib/themes/theme-utils.js logic. Token values themselves are
      // applied by React on mount; this sets the mode + theme id early.
      try {
        var appearance = localStorage.getItem("metrivia.appearance");
        if (
          appearance !== "light" &&
          appearance !== "dark" &&
          appearance !== "system"
        ) {
          var legacy = localStorage.getItem("metrivia-theme");
          appearance =
            legacy === "light" || legacy === "dark" ? legacy : "system";
        }
        var mode =
          appearance === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : appearance;
        var themeId =
          localStorage.getItem("metrivia.theme-id") || "mocha-mousse";
        document.documentElement.setAttribute("data-theme", themeId);
        if (mode === "dark") {
          document.documentElement.classList.add("dark");
        }
        document.documentElement.style.colorScheme = mode;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
